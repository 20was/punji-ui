# CI: one fast job for the package, one visual regression and browser a11y job,
# one for workflow files, and a single required check ("CI OK") that passes when
# the jobs that had to run passed.
# Free: standard GitHub-hosted runners cost nothing on a public repository.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      package: ${{ steps.filter.outputs.package }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            package:
              - 'src/**'
              - 'test/**'
              - 'examples/**'
              - 'portal/**'
              - 'site/**'
              - 'fixtures/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - '.nvmrc'
              - 'tsconfig*.json'
              - 'vitest.config.ts'
              - 'playwright.config.ts'
              - 'vitest.setup.ts'
              - '.size-limit.json'
              - '.oxlintrc.json'
              - '.changeset/config.json'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/workflows/**'
              - '.github/dependabot.yml'

  verify:
    name: Lint, types, test, build, size, package
    needs: changes
    if: needs.changes.outputs.package == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lockfile resolves only to the npm registry over https with integrity
        run: npm run check:lockfile
      - name: Registry signatures and provenance of installed packages
        run: npm audit signatures
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run typecheck:examples
      - run: npm run typecheck:portal
      - run: npm run typecheck:site
      - name: Build the documentation site
        run: npm run site:build
      - run: npm run build:examples
      - name: Install Chromium for package example checks
        run: npx playwright install --with-deps chromium
      - run: npm run check:examples
      - name: Documentation site in a browser (axe, overflow, console, copy, theme)
        run: npm run check:site
      - name: Size budgets
        run: npm run size
      - name: Package (publint, are-the-types-wrong, tarball contents)
        run: npm run check:package

  visual:
    name: Visual regression and browser a11y
    needs: changes
    if: needs.changes.outputs.package == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    # Baselines are rendered in this exact image (Playwright 1.64.1, Ubuntu noble,
    # linux/amd64), so Chromium and fonts match `npm run test:visual:update`.
    # Keep the tag in step with the pinned @playwright/test version; browsers
    # ship inside the image, so there is nothing to download or cache.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Screenshot comparison, interactions and axe (builds the fixture app)
        env:
          CI: 'true'
        run: npx playwright test
      - name: Upload diffs, traces and report (failures only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-regression-diffs
          path: |
            test-results/visual/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  workflows:
    name: Workflow lint (actionlint, zizmor)
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (pinned release, checksum verified)
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSLo actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tgz" | sha256sum -c -
          tar xzf actionlint.tgz actionlint
          ./actionlint -color
      - name: zizmor (workflow security audit)
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          persona: regular

  ci-ok:
    name: CI OK
    needs: [changes, verify, visual, workflows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every job that had to run passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then exit 1; fi
          done

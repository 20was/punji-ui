# Sync: mirrors the kit from Punji's web app, the one source of truth for the
# code under src/. Every 6 hours (and on demand) it runs the sync script on
# Punji's main branch. No change: it stops. A change: it runs every gate, then
# opens or updates the "sync/punji-web" pull request and turns on auto-merge,
# so the PR merges itself once CI passes. A module, class or adapter target
# the manifest does not know fails this job and opens no PR: update
# scripts/sync/manifest.mjs.
#
# Owner setup: two fine-grained tokens, each limited to one repository, because
# a fine-grained token grants the same permissions on every repository it covers:
# - PUNJI_WEB_READ_TOKEN: only 20was/punji-web, Contents read-only (the source).
# - PUNJI_UI_PR_TOKEN: only 20was/punji-ui, Contents and Pull requests read and
#   write. A PR opened with the workflow's own token would not run CI, so this
#   token opens it.
name: Sync

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror the kit from Punji
    if: github.repository == '20was/punji-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: The sync tokens are set
        env:
          READ_TOKEN: ${{ secrets.PUNJI_WEB_READ_TOKEN }}
          PR_TOKEN: ${{ secrets.PUNJI_UI_PR_TOKEN }}
        run: |
          missing=0
          if [ -z "${READ_TOKEN}" ]; then echo "::error::PUNJI_WEB_READ_TOKEN is not set (CONTRIBUTING.md, How the kit is kept in sync with Punji)"; missing=1; fi
          if [ -z "${PR_TOKEN}" ]; then echo "::error::PUNJI_UI_PR_TOKEN is not set (CONTRIBUTING.md, How the kit is kept in sync with Punji)"; missing=1; fi
          exit "${missing}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out Punji's web app (read only, shallow)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 20was/punji-web
          ref: main
          path: .punji-web
          fetch-depth: 1
          token: ${{ secrets.PUNJI_WEB_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Sync
        id: sync
        run: |
          sha="$(git -C .punji-web rev-parse HEAD)"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          PUNJI_WEB_DIR=.punji-web npm run sync
          rm -rf .punji-web
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "Nothing to mirror: the package matches Punji @${sha:0:12}."
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            git status --short
          fi
      - name: Every gate, with deep property runs
        if: steps.sync.outputs.changed == 'true'
        run: npm run verify:deep
      - name: Open or update the sync pull request, merge when green
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PUNJI_UI_PR_TOKEN }}
          SHA: ${{ steps.sync.outputs.sha }}
        run: |
          short="${SHA:0:12}"
          title="chore(sync): mirror the kit from Punji @${short}"
          printf -- "---\n'@punji/ui': patch\n---\n\nMirrored the kit from Punji @%s.\n" "${short}" > ".changeset/sync-${short}.md"
          git config user.name "punji-ui sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git checkout -B sync/punji-web
          git add -A
          git commit -q -m "${title}"
          git push --force origin sync/punji-web
          body="$(printf 'Mirrored automatically by the Sync workflow from Punji @ [%s](https://github.com/20was/punji-web/commit/%s) (private).\n\nEvery gate ran with deep property runs before this push; it merges itself once CI passes. Run %s/%s/actions/runs/%s.' "${short}" "${SHA}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}")"
          if [ "$(gh pr view sync/punji-web --json state --jq .state 2>/dev/null || true)" = "OPEN" ]; then
            gh pr edit sync/punji-web --title "${title}" --body "${body}"
          else
            gh pr create --base main --head sync/punji-web --title "${title}" --body "${body}"
          fi
          gh pr merge sync/punji-web --auto --squash
      - name: Close a sync pull request the source no longer needs
        if: steps.sync.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ secrets.PUNJI_UI_PR_TOKEN }}
        run: |
          if [ "$(gh pr view sync/punji-web --json state --jq .state 2>/dev/null || true)" = "OPEN" ]; then
            gh pr close sync/punji-web --delete-branch --comment "Punji's kit matches main again; nothing to mirror."
          fi
